name: E2E Full Matrix

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

permissions:
  contents: read

jobs:
  # The complete E2E suite across the Godot compatibility matrix. PR CI
  # runs only the e2e_smoke subset (see ci.yml Stage 3); this workflow
  # re-verifies the full suite on a schedule.
  e2e-full:
    name: Full E2E (${{ matrix.godot-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot-version: ['4.5.2', '4.6.1', '4.7.1']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Godot
        uses: ./.github/actions/install-godot
        with:
          version: ${{ matrix.godot-version }}

      - name: Run full E2E suite
        run: pytest tests/e2e/ -m e2e --no-cov --durations=20 --junitxml=junit-e2e.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-e2e-full-${{ matrix.godot-version }}-${{ matrix.os }}
          path: junit-e2e.xml
          retention-days: 7
