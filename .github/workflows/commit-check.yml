name: Commit Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install commitizen

      - name: Check commit messages
        run: |
          python - <<'PY'
          import subprocess

          commits = subprocess.check_output(
              ["git", "rev-list", "--reverse", "origin/${{ github.base_ref }}..HEAD"],
              text=True,
          ).splitlines()

          for commit in commits:
              message = subprocess.check_output(
                  ["git", "show", "-s", "--format=%B", commit],
                  text=True,
              )
              subprocess.run(
                  [
                      "cz",
                      "check",
                      "--message",
                      message,
                      "--allowed-prefixes",
                      "Merge",
                      "Revert",
                      "Pull request",
                      "fixup!",
                      "squash!",
                      "amend!",
                      "conductor:",
                      "conductor(",
                  ],
                  check=True,
              )
          PY
