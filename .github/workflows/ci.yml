name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Stage 1: Lint, Format & Unit Tests
  # ──────────────────────────────────────────────────────────────────
  lint-format-unit:
    name: Stage 1 - Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -m unit --cov=gd_tools --cov-report=xml --cov-report=html --junitxml=junit-unit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-unit
          path: junit-unit.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Cross-Platform Matrix: Unit Tests
  # ──────────────────────────────────────────────────────────────────
  matrix-unit:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint-format-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -m unit --no-cov --junitxml=junit-matrix.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit-matrix.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Stage 2: Integration Tests (requires Godot binary)
  # ──────────────────────────────────────────────────────────────────
  integration:
    name: Stage 2 - Integration Tests (${{ matrix.godot-version }}, ${{ matrix.os }})
    needs: lint-format-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot-version: ['4.5.2', '4.6.1', '4.7.1']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Godot
        uses: ./.github/actions/install-godot
        with:
          version: ${{ matrix.godot-version }}

      # The playtest-coverage integration tests launch Godot windowed
      # (no --headless), which needs a display server.  Provide a
      # virtual one on the display-less ubuntu runners.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/integration/ -m integration --no-cov --durations=20 --junitxml=junit-integration.xml

      - name: Run integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pytest tests/integration/ -m integration --no-cov --durations=20 --junitxml=junit-integration.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-integration-${{ matrix.godot-version }}-${{ matrix.os }}
          path: junit-integration.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Stage 3: E2E Tests (requires Godot + sample project)
  # ──────────────────────────────────────────────────────────────────
  e2e:
    name: Stage 3 - E2E Smoke Tests (${{ matrix.godot-version }}, ${{ matrix.os }})
    needs: integration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        godot-version: ['4.5.2', '4.6.1', '4.7.1']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Godot
        uses: ./.github/actions/install-godot
        with:
          version: ${{ matrix.godot-version }}

      - name: Run E2E smoke tests
        run: pytest tests/e2e/ -m "e2e and e2e_smoke" --no-cov --durations=20 --junitxml=junit-e2e.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-e2e-${{ matrix.godot-version }}-${{ matrix.os }}
          path: junit-e2e.xml
          retention-days: 7
